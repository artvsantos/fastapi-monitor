name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    # Com pipefail, "pytest | tee" falha quando o pytest falha.
    shell: bash

env:
  # Só para o CI (o banco é descartado no fim). Não é segredo de produção.
  SECRET_KEY: chave-do-ci-so-para-os-testes-com-mais-de-32-caracteres
  POSTGRES_URL: postgresql+asyncpg://monitor:monitor@localhost:5432/monitor

jobs:
  tests:
    name: Lint e testes (SQLite e Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes no SQLite, com cobertura
        run: pytest --cov 2>&1 | tee saida-sqlite.log

      # As migrações vêm antes dos testes: elas precisam do banco vazio, e
      # os testes deixam as tabelas criadas no fim.
      - name: Migrações no Postgres (subir, conferir e desfazer)
        env:
          DATABASE_URL: ${{ env.POSTGRES_URL }}
        run: |
          {
            alembic upgrade head
            alembic check
            alembic downgrade base
            alembic upgrade head
          } 2>&1 | tee saida-migracoes.log

      - name: Testes no Postgres
        env:
          TEST_DATABASE_URL: ${{ env.POSTGRES_URL }}
        run: pytest 2>&1 | tee saida-postgres.log

      # O log completo só aparece para quem está logado no GitHub; o fim
      # dele vira uma anotação, que aparece no resumo da execução.
      - name: Resumo do erro
        if: failure()
        run: |
          for log in saida-*.log; do
            [ -f "$log" ] || continue
            mensagem=$(tail -n 40 "$log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$log::$mensagem"
          done

  docker:
    name: Imagem Docker e docker-compose
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      - name: Subir API, worker e Postgres
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: A API responde
        run: |
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent --output /dev/null http://localhost:8000/docs

      - name: Logs (se algo falhar)
        if: failure()
        run: |
          docker compose logs
          mensagem=$(docker compose logs --tail 15 2>&1 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=docker compose::$mensagem"

      - name: Desligar
        if: always()
        run: docker compose down --volumes
